name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        env:
          # huangyanhui.com is served from the domain root, so its assets
          # must not inherit the repository-name path prefix.
          NEXT_PUBLIC_BASE_PATH: ""
        run: npx next build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

      # Confirm the uploaded artifact is visible before attempting deployment.
      - name: Wait for Pages artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const url = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts`;
          let ready = false;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const response = await fetch(url, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
              },
            });
            if (!response.ok) throw new Error(`Artifact check failed: HTTP ${response.status}`);
            const data = await response.json();
            ready = data.artifacts.some(artifact => artifact.name === 'github-pages' && !artifact.expired);
            if (ready) break;
            console.log(`Waiting for Pages artifact (${attempt}/12)`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!ready) throw new Error('Pages artifact was not available after 60 seconds');
          console.log('Pages artifact is available');
          NODE

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
